<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: data: blob:; media-src file: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>TankAir Studio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="online.css">
  <link rel="stylesheet" href="canvas-editor.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="workshop.css">
</head>
<body>
  <div id="wall"></div>
  <div class="app">
    <header class="titlebar">
      <div class="brand"><span id="logo"></span><b>TankAir</b>&nbsp;Studio<span class="brand-sub" id="title-crumb">конструктор модпаков</span></div>
      <div class="title-center" id="title-center"></div>
      <div class="title-right"><div class="title-actions" id="title-actions"></div>
      <div class="win-buttons">
        <button data-act="win-min" title="Свернуть"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
        <button data-act="win-max" title="Развернуть"><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
        <button data-act="win-close" class="close" title="Закрыть"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10" stroke="currentColor"/></svg></button>
      </div></div>
    </header>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="page" id="page"></main>
  </div>
  <div id="modal"></div>
  <div id="toasts"></div>
  <div id="dropzone" hidden><div>Отпустите, чтобы добавить<small>моды: .mtmod · .wotmod · .zip · папка &nbsp;|&nbsp; картинки — на поле превью</small></div></div>
  <script src="icons.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
  <script src="online.js"></script>
  <script src="installer-ui.js"></script>
  <script src="canvas-editor.js"></script>
  <script src="shell.js"></script>
  <script src="workshop.js"></script>
</body>
</html>
